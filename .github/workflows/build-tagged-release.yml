name: Build Tagged Release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
      release_tag:
        description: Release tag / package version tag (must be a valid Python package version)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-linux-all:
    runs-on: ubuntu-22.04
    container:
      image: yolkarian/sapien-build-env:0.2
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 2
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare version tag
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git tag -f "${RELEASE_TAG}" HEAD
          while IFS= read -r tag; do
            if [ "${tag}" != "${RELEASE_TAG}" ]; then
              git tag -d "${tag}"
            fi
          done < <(git tag --points-at HEAD)
          git describe --tags --exact-match HEAD
      - name: Set up cmake cache
        uses: actions/cache@v4
        with:
          path: docker_sapien_build/_sapien_deps
          key: ${{ runner.os }}.${{ hashFiles('**/*.cmake', '**/CMakeLists.txt') }}
      - name: Build wheels
        run: ./scripts/build.sh
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-all
          path: ./wheelhouse/*.whl

  build-windows-sapien:
    runs-on: windows-2022
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare version tag
        shell: bash
        run: |
          git tag -f "${RELEASE_TAG}" HEAD
          while IFS= read -r tag; do
            if [ "${tag}" != "${RELEASE_TAG}" ]; then
              git tag -d "${tag}"
            fi
          done < <(git tag --points-at HEAD)
          git describe --tags --exact-match HEAD
      - name: setup CUDA
        shell: bash
        run: |
          C:/msys64/usr/bin/wget.exe https://developer.download.nvidia.com/compute/cuda/12.8.0/network_installers/cuda_12.8.0_windows_network.exe
          ./cuda_12.8.0_windows_network.exe -s cudart_12.8 nvcc_12.8 visual_studio_integration_12.8 nvtx_12.8 curand_dev_12.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        shell: bash
        run: |
          ls "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          python -m pip install setuptools wheel
          python --version
          export CUDA_PATH="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          export CudaToolkitDir="C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8"
          python setup.py --sapien-only --build-dir=sapien_build
      - name: Upload SAPIEN
        uses: actions/upload-artifact@v4
        with:
          name: windows-sapien
          path: sapien_build/_sapien_install

  build-windows-pybind:
    runs-on: windows-2022
    needs: build-windows-sapien
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare version tag
        shell: bash
        run: |
          git tag -f "${RELEASE_TAG}" HEAD
          while IFS= read -r tag; do
            if [ "${tag}" != "${RELEASE_TAG}" ]; then
              git tag -d "${tag}"
            fi
          done < <(git tag --points-at HEAD)
          git describe --tags --exact-match HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download SAPIEN
        uses: actions/download-artifact@v4
        with:
          name: windows-sapien
          path: sapien_build/_sapien_install
      - name: Build wheels
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -U setuptools wheel
          python setup.py bdist_wheel --pybind-only --build-dir=sapien_build
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel-${{ matrix.python-version }}
          path: ./dist/*.whl

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-all, build-windows-pybind]
    permissions:
      contents: write
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download windows wheels (3.9)
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel-3.9
          path: wheelhouse
      - name: Download windows wheels (3.10)
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel-3.10
          path: wheelhouse
      - name: Download windows wheels (3.11)
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel-3.11
          path: wheelhouse
      - name: Download windows wheels (3.12)
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel-3.12
          path: wheelhouse
      - name: Download linux wheels
        uses: actions/download-artifact@v4
        with:
          name: linux-wheels-all
          path: wheelhouse
      - name: List wheels
        run: ls wheelhouse
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh auth status

          args=()
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --target "${BUILD_REF}" \
            --title "SAPIEN ${RELEASE_TAG}" \
            --notes "Manual SAPIEN build from ${BUILD_REF}." \
            "${args[@]}" \
            wheelhouse/*.whl
