name: Build Tagged Release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (branch, tag, or commit SHA)
        required: true
        default: main
        type: string
      release_tag:
        description: Release tag / package version tag (must be a valid Python package version)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
      release_notes:
        description: Markdown release notes for the GitHub release; use gh --json for multiline notes
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-linux-all:
    runs-on: ubuntu-22.04
    container:
      image: yolkarian/sapien-build-env:0.3.2
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare version tag
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git tag -f "${RELEASE_TAG}" HEAD
          while IFS= read -r tag; do
            if [ "${tag}" != "${RELEASE_TAG}" ]; then
              git tag -d "${tag}"
            fi
          done < <(git tag --points-at HEAD)
          git describe --tags --exact-match HEAD
      - name: Set up cmake cache
        uses: actions/cache@v4
        with:
          path: docker_sapien_build/_sapien_deps
          key: ${{ runner.os }}.${{ hashFiles('**/*.cmake', '**/CMakeLists.txt') }}
      - name: Build wheels and C++ SDK
        run: ./scripts/build.sh
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-all
          path: ./wheelhouse/*.whl
      - name: Upload C++ SDK
        uses: actions/upload-artifact@v4
        with:
          name: linux-sdk
          path: ./dist/sapien-sdk-*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-all]
    permissions:
      contents: write
    env:
      BUILD_REF: ${{ inputs.git_ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download linux wheels
        uses: actions/download-artifact@v4
        with:
          name: linux-wheels-all
          path: wheelhouse
      - name: Download linux C++ SDK
        uses: actions/download-artifact@v4
        with:
          name: linux-sdk
          path: wheelhouse
      - name: List release assets
        run: ls wheelhouse
      - name: Write release notes
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          if [ -z "$(printf '%s' "${RELEASE_NOTES_INPUT}" | tr -d '[:space:]')" ]; then
            echo "release_notes input must not be empty" >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_NOTES_INPUT}" > release_notes.md
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh auth status

          args=()
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GH_REPO}" \
            --target "${BUILD_REF}" \
            --title "SAPIEN ${RELEASE_TAG}" \
            --notes-file release_notes.md \
            "${args[@]}" \
            wheelhouse/*.whl \
            wheelhouse/sapien-sdk-*.tar.gz
