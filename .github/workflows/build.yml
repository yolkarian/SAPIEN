name: Build

# Every push to main or dev builds Linux wheels and the Linux C++ SDK and publishes them
# to a rolling prerelease: `nightly` for main, `dev-nightly` for dev. A manual run (Actions tab, or
# `gh workflow run build.yml --ref dev`) does the same for the selected branch; on other branches
# it only keeps the wheels and the SDK as workflow artifacts.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer build of a branch cancels the one still running, so an older build can never overwrite
# the rolling release after a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-linux-all:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: yolkarian/sapien-build-env:0.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
          fetch-tags: true
      - name: Set up cmake cache
        uses: actions/cache@v4
        with:
          path: docker_sapien_build/_sapien_deps
          key: ${{ runner.os }}.${{ hashFiles('**/*.cmake', '**/CMakeLists.txt') }}
      - name: Build wheels and C++ SDK
        run: "git config --global --add safe.directory '*' && ./scripts/build.sh"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-all
          path: ./wheelhouse/*.whl
      - name: Upload C++ SDK
        uses: actions/upload-artifact@v4
        with:
          name: linux-sdk
          path: ./dist/sapien-sdk-*.tar.gz

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: [build-linux-all]
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: linux-wheels-all
          path: wheelhouse
      - name: Download C++ SDK
        uses: actions/download-artifact@v4
        with:
          name: linux-sdk
          path: wheelhouse
      - name: ls
        run: ls wheelhouse
      - name: Update rolling release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name == 'main' && 'nightly' || 'dev-nightly' }}
          name: ${{ github.ref_name == 'main' && 'Nightly Release' || 'Dev Nightly Release' }}
          prerelease: true
          # a manual rerun of the commit the tag already points at still replaces the assets
          only-when-changed: false
          body: ${{ github.ref_name == 'main' && 'SAPIEN development nightly release. This release is mainly for internal testing. Release wheels and the C++ SDK are published on GitHub Releases.' || 'Rolling build of the dev branch (wheels and the Linux C++ SDK), replaced on every push to dev. For internal testing only; stable builds are published as numbered releases.' }}
          files: |
            ./wheelhouse/*.whl
            ./wheelhouse/sapien-sdk-*.tar.gz
