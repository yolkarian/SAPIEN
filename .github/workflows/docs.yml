name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "python/**"
      - "include/**"
      - "src/**"
      - "CHANGELOG.md"
      - "readme.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The published Linux wheels currently depend on glibc symbols newer than
    # Ubuntu 22.04 provides, so build docs on Ubuntu 24.04 where they import.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r docs/requirements.txt

      - name: Install SAPIEN release wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheelhouse
          release_tag=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "${release_tag}" ]; then
            echo "No GitHub release found for ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          # Match any manylinux tag: the platform floor moves with the PhysX baseline, and
          # pinning it here silently downloads nothing when it changes.
          gh release download "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'sapien-*-cp311-cp311-manylinux_*_x86_64.whl' \
            --dir wheelhouse
          python -m pip install wheelhouse/sapien-*-cp311-cp311-manylinux_*_x86_64.whl
          python -c 'import sapien, os; print(os.path.dirname(sapien.__file__))'

      - name: Build documentation
        run: make -C docs html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
