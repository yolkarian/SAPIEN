[base]
env_name = sapien_robot_arm
# The environment sets PUF_ENV_CAPTURABLE 0: its physics steps block the host and cannot be
# recorded into a CUDA graph, so only each policy step and the training epoch are graphed.
cudagraphs = 1
seed = 42
checkpoint_interval = 10

[vec]
total_agents = 4096
# GPU environments run as one buffer
num_buffers = 1
num_threads = 1

[env]
# robot_arm.ini's task settings; only the pick-and-place mode exists
model_glb = resources/robot_arm/franka_panda.glb
no_timeout = 0
stack = 0
basketball = 0
# SAPIEN physics steps per 1/60 s control step, and PhysX solver iterations
substeps = 4
solver_position_iterations = 8
solver_velocity_iterations = 1

# robot_arm.ini's policy and training settings
[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
horizon = 128
minibatch_size = 32768
replay_ratio = 1.0
clip_coef = 0.2
ent_coef = 0.002
anneal_ent_coef = 1
min_ent_coef_ratio = 0.5
vf_coef = 0.5
max_grad_norm = 0.5
