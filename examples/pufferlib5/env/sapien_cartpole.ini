[base]
env_name = sapien_cartpole
# The environment sets PUF_ENV_CAPTURABLE 0: its physics step blocks the host and cannot be
# recorded into a CUDA graph, so only each policy step and the training epoch are graphed.
cudagraphs = 1

[vec]
total_agents = 4096
# GPU environments run as one buffer
num_buffers = 1
num_threads = 1

[env]
seed = 1

[train]
total_timesteps = 20_000_000
horizon = 64
gamma = 0.99
gae_lambda = 0.95
# float32, 4096 agents: the trainer default 0.015 diverged on seed 2 of seeds 1-7; 0.007 learned
# on seeds 1-3 (and in bfloat16 on seeds 1-2)
learning_rate = 0.007
minibatch_size = 8192
